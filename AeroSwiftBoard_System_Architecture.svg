<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">AeroSwiftBoard system architecture</title>
  <desc id="description">Architecture diagram showing a browser UI communicating over HTTP and JSON with Spring Boot REST controllers, which call the passenger boarding service. The service uses passenger and priority selection state. At startup, a CSV loader reads passengers.csv and initializes passenger state.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#52677d"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #10263f; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #607387; }
      .heading { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #10263f; }
      .body { font: 14px "Segoe UI", Arial, sans-serif; fill: #34495b; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #607387; }
      .node { fill: #ffffff; stroke: #c9d5df; stroke-width: 2; }
      .ui { fill: #eaf5f5; stroke: #138486; }
      .api { fill: #edf2f8; stroke: #42627f; }
      .service { fill: #eaf3fb; stroke: #2874a6; }
      .state { fill: #f3f6f8; stroke: #718497; }
      .source { fill: #fff7e8; stroke: #c28b2c; }
      .connector { fill: none; stroke: #52677d; stroke-width: 2.5; marker-end: url(#arrow); }
      .connector-label { font: 12px "Segoe UI", Arial, sans-serif; fill: #52677d; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f5f8fa"/>
  <text x="600" y="52" text-anchor="middle" class="title">AeroSwiftBoard System Architecture</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">Single-page boarding display and Spring Boot backend</text>

  <rect x="390" y="112" width="420" height="98" rx="14" class="node ui"/>
  <text x="600" y="148" text-anchor="middle" class="heading">Browser UI</text>
  <text x="600" y="176" text-anchor="middle" class="body">HTML · CSS · JavaScript</text>
  <text x="600" y="197" text-anchor="middle" class="small">Displays the next passengers and submits user actions</text>

  <path d="M600 210 V270" class="connector"/>
  <text x="614" y="247" class="connector-label">HTTP / JSON</text>

  <rect x="390" y="274" width="420" height="105" rx="14" class="node api"/>
  <text x="600" y="311" text-anchor="middle" class="heading">Spring Boot REST API</text>
  <text x="600" y="339" text-anchor="middle" class="body">Passenger and priority controllers</text>
  <text x="600" y="362" text-anchor="middle" class="small">Validates requests and delegates application operations</text>

  <path d="M600 379 V436" class="connector"/>

  <rect x="390" y="440" width="420" height="112" rx="14" class="node service"/>
  <text x="600" y="478" text-anchor="middle" class="heading">Passenger Boarding Service</text>
  <text x="600" y="507" text-anchor="middle" class="body">Selects comparator · retrieves queue · boards passenger</text>
  <text x="600" y="532" text-anchor="middle" class="small">Returns ordered passengers and remaining count</text>

  <path d="M470 552 V598 H300 V630" class="connector"/>
  <text x="322" y="589" class="connector-label">reads / updates</text>
  <path d="M730 552 V598 H900 V630" class="connector"/>
  <text x="782" y="589" class="connector-label">reads</text>

  <rect x="105" y="634" width="390" height="105" rx="14" class="node state"/>
  <text x="300" y="671" text-anchor="middle" class="heading">Passenger State</text>
  <text x="300" y="700" text-anchor="middle" class="body">In-memory passenger list</text>
  <text x="300" y="723" text-anchor="middle" class="small">Updated when a passenger boards</text>

  <rect x="705" y="634" width="390" height="105" rx="14" class="node state"/>
  <text x="900" y="671" text-anchor="middle" class="heading">Priority Selection State</text>
  <text x="900" y="700" text-anchor="middle" class="body">In-memory senior / veteran preferences</text>
  <text x="900" y="723" text-anchor="middle" class="small">Used to select the boarding comparator</text>

  <rect x="105" y="300" width="210" height="95" rx="14" class="node source"/>
  <text x="210" y="337" text-anchor="middle" class="heading">passengers.csv</text>
  <text x="210" y="365" text-anchor="middle" class="body">Sample passenger data</text>
  <path d="M210 395 V585 H300 V630" class="connector"/>
  <text x="224" y="570" class="connector-label">startup load</text>

  <rect x="130" y="770" width="940" height="1" fill="#d7e0e7"/>
  <text x="600" y="790" text-anchor="middle" class="small">Passenger and preference state are in memory and reset when the application restarts.</text>
</svg>
